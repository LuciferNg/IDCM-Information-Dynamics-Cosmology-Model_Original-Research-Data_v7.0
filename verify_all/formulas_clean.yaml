# ==============================================================================
# IDCM Formula Registry — Single Source of Truth
# Schema v1.0 — 2026-07-27
# 
# 每條公式記錄：
#   - 公式本體 (expression, value)
#   - 母構體 (parent) — 從哪個結構湧現
#   - 推導類型 (derivation_type) — structural / perturbative / fitting
#   - 修正記錄 (corrections) — 微擾修正的來源
#   - 審計標記 (audit) — 自動檢測用 metadata
# ==============================================================================

# ─── Schema Metadata ───
schema_version: "1.0"
last_updated: "2026-07-27"
curator: "L. Ng"
description: "Complete IDCM formula registry with parent structure tracking and anti-fitting audit"

# ─── 母構體目錄 (Parent Structure Catalog) ───
# 每個母構體是公式湧現的源頭
parent_structures:
  K_chain_tree:
    id: "K = K_chain ⊗ K_tree"
    description: "W-field coupling matrix tensor product decomposition"
    parameters: ["N_d=44", "L=53/8", "M=33"]
    outputs: "Fermion mass ratios, sector k-values"
    
  W_field_potential:
    id: "V = -ε|W|² + κ|W|⁴"
    description: "W-field potential minimum and curvature"
    parameters: ["ε=φ⁻¹/4", "κ=1/16"]
    outputs: "Higgs mass (radial mode), PG mass (phase mode)"
    
  MERA_isometry:
    id: "U = 1/√(φ²+1) [φ,1; 1,-φ]"
    description: "MERA isometry preserving φ-ratio across layers"
    parameters: ["φ"]
    outputs: "Generation mixing, PMNS angles"
    
  chain_eigenvalue:
    id: "γ_n = 4sin²(πn/(2N_d))"
    description: "Discrete chain Laplacian eigenvalue spectrum"
    parameters: ["N_d=44"]
    outputs: "Three generation modes, mass hierarchy"
    
  tree_eigenvalue:
    id: "μ_m = φ^(L-m)"
    description: "MERA tree eigenvalue spectrum"
    parameters: ["L=53/8", "φ"]
    outputs: "Sector k-values (k_u, k_d, k_l)"
    
  MERA_total_depth:
    id: "D_H/L_P = φ^(N_d·L + boundary)"
    description: "Total MERA graph depth → Hubble/Planck ratio"
    parameters: ["N_d=44", "L=53/8", "ε"]
    outputs: "D_H/L_P, L_P, H₀"
    
  renormalization_flow:
    id: "M_P = m_e / ε^(17φ + φ⁻⁵ + corrections)"
    description: "Renormalization flow from electron to Planck mass"
    parameters: ["φ", "ε", "m_e"]
    outputs: "M_P, G, ħ"
    
  CY3_geometry:
    id: "CY₃(36,98) κ-tensor"
    description: "Calabi-Yau threefold Hodge numbers and geometric fingerprint"
    parameters: ["h¹¹=36", "h²¹=98", "M=33"]
    outputs: "k-values, CKM hierarchy, geometric invariants"
    
  sync_boundary:
    id: "Sync node boundary interface"
    description: "Boundary corrections at the edge of causal domain chain"
    parameters: ["ε", "N_d"]
    outputs: "ε²-ε³-ε⁴ series, EM corrections"
    
  budget_scheduling:
    id: "Finite throughput scheduling"
    description: "Fibonacci scheduling of finite pipe width"
    parameters: ["φ"]
    outputs: "Ω_Λ, dark energy"

# ─── 推導類型定義 ───
